services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    entrypoint: ["sh", "/app/entrypoint.sh"]
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "8001:8000"
    depends_on:
      - db

volumes:
  postgres_data: