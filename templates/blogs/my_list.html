{% extends 'base.html' %}
{% block title %}My Blog Posts{% endblock %}
{% block content %}
<section class="section container">
<div class="section-heading"><h2>My Blog Posts</h2><a class="button" href="{% url 'blog_create' %}">Create new</a></div>
<table class="table">
    <tr><th>Title</th><th>Status</th><th>Created</th></tr>
    {% for post in posts %}
    <tr><td>{{ post.title }}</td><td>{{ post.get_status_display }}</td><td>{{ post.created_at|date:'Y-m-d' }}</td></tr>
    {% empty %}
    <tr><td colspan="3">No posts yet.</td></tr>
    {% endfor %}
</table>
</section>
{% endblock %}
