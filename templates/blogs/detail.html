{% extends 'base.html' %}
{% block title %}{{ post.title }}{% endblock %}
{% block content %}
<article class="card">
    <h2>{{ post.title }}</h2>
    <p class="meta">By {{ post.author.username }} · {{ post.created_at|date:'Y-m-d H:i' }}</p>
    <div>{{ post.content|linebreaks }}</div>
</article>
{% endblock %}
