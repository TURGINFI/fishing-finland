{% extends 'base.html' %}
{% block title %}My Events{% endblock %}
{% block content %}
<h2>My Event Registrations</h2>
<table class="table">
    <tr><th>Event</th><th>Date</th><th>Location</th></tr>
    {% for reg in registrations %}
    <tr><td>{{ reg.event.title }}</td><td>{{ reg.event.start_time }}</td><td>{{ reg.event.location }}</td></tr>
    {% empty %}
    <tr><td colspan="3">No registrations yet.</td></tr>
    {% endfor %}
</table>
{% endblock %}
